    <div class="backDrop closeModel" id="backDrop"></div>
    <div class="movieModel" id="movieModel">
        <form id="movieForm">
            <div class="card">
                <div class="card-header d-flex justify-content-between" id="movieCloseIcon">
                    <h4 class="m-0">Enter Movie details</h4>
                    <i class="closeMovieModal fa-solid fa-xmark fa-2x text-danger" role="button"></i>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="movieName">Movie Name</label>
                        <input type="text" id="movieName" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="movieImage">Movie Image</label>
                        <input type="text" id="movieImage" class="form-control">
                    </div>


                    <div class="form-group">
                        <label for="movieDescription">Movie Description</label>
                        <textarea required id="movieDescription" class="form-control" rows="5"></textarea>
                    </div>


                    <div class="form-group">
                        <label for="movieRating">Movie Rating</label>
                        <select type="text" id="movieRating" class="form-control">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                </div>

                <div class="card-footer d-flex justify-content-between">
                    <button type="submit" class="btn btn-sm net-sec-btn" id="addMovieBtn">Add movie</button>
                    <button type="button" class="btn btn-sm net-sec-btn d-none" id="updateMovieBtn">Update
                        Movie</button>
                    <button type="button" class="btn btn-sm net-pri-btn closeModelBtn"
                        id="cancelMovieBtn">Cancel</button>
                </div>
            </div>
        </form>
    </div>
